[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-relic"
version = "0.1.0"
description = "Relic: a terminal AI companion with a persistent personality and memory."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4.7", "numpy>=1.26", "piper-tts>=1.2"]

[project.scripts]
relic = "relic.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
